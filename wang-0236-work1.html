<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            line-height: 1.6;
        }

        /* 顶部标题 */
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        /* 个人信息填写卡片：头像和表单在同一个栏里 */
        .profile-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #ddd;
            margin-bottom: 40px;
        }

        /* 白灰色圆形默认头像，放在信息填写区顶部 */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #e5e7eb;
            margin: 0 auto 25px;
            position: relative;
            overflow: hidden;
        }

        .avatar::before {
            content: "";
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f9fafb;
        }

        .avatar::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 55px;
            border-radius:: 45px 45px 0 0;
            background: #f9fafb;
        }

        .profile-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* 表单 */
        .form-item {
            margin-bottom: 16px;
        }

        .form-item label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 15px;
        }

        .form-item input,
        .form-item textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fafafa;
        }

        button {
            padding: 10px 26px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin-top: 10px;
        }

        /* 技能区域 */
        .skill-title {
            text-align: center;
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .skill-wrap {
            display: flex;
            gap: 20px;
        }

        .skill-card {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
            text-align: center;
        }

        .skill-card h3 {
            color: #3498db;
            margin-bottom: 8px;
            font-size: 17px;
        }

        .skill-card p {
            color: #555;
            font-size: 14px;
        }

        /* 页脚 */
        footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 18px;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>我的个人主页</h1>
    <p>Web前端 work1作业</p >
</header>

<div class="container">

    <!-- 头像和信息填写合并在同一个个人信息填写栏 -->
    <div class="profile-card">
        <div class="avatar"></div>
        <h2>个人信息填写</h2>

        <form>
            <div class="form-item">
                <label>姓名</label>
                <input type="text" placeholder="请输入姓名">
            </div>

            <div class="form-item">
                <label>学号</label>
                <input type="text" placeholder="请输入学号">
            </div>

            <div class="form-item">
                <label>专业</label>
                <input type="text" placeholder="请输入专业">
            </div>

            <div class="form-item">
                <label>兴趣爱好</label>
                <textarea rows="3" placeholder="请输入兴趣爱好"></textarea>
            </div>

            <button type="submit">提交</button>
        </form>
    </div>

    <!-- 技能卡片 -->
    <h2 class="skill-title">我的技能</h2>

    <div class="skill-wrap">
        <div class="skill-card">
            <h3>HTML基础</h3>
            <p>掌握网页结构搭建</p >
        </div>

        <div class="skill-card">
            <h3
